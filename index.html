<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1079af">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Memo Terrain">
<meta name="robots" content="noindex,nofollow">
<title>Memo Terrain</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#ffffff;--ink:#1b2430;--muted:#5d6a78;--line:#d5dbe2;--accent:#1079af;--accent-ink:#fff;--err:#b3361f;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#12171d;--ink:#e7ecf1;--muted:#97a4b2;--line:#2c3642;--accent:#4fa8dc;--accent-ink:#0b1823;--err:#ec7a63;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
.wrap{min-height:100%;max-width:460px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.logo{width:120px;height:120px;border-radius:26px;border:1px solid var(--line);background:#fff}
p{margin:0}
.muted{color:var(--muted);font-size:.9rem}
input{width:100%;font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:10px;padding:12px}
input:focus{outline:2px solid var(--accent);border-color:transparent}
button,.btn{width:100%;font:inherit;font-weight:600;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:14px;cursor:pointer;text-decoration:none;display:block}
.link{background:none;color:var(--accent);font-weight:400;padding:6px;width:auto;text-decoration:underline}
.err{color:var(--err);font-size:.9rem}
.credit{color:var(--muted);font-size:.8rem;letter-spacing:.04em;margin-top:8px}
.ais{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:100%}
.ais button{width:auto;flex:1 1 30%;font-weight:500;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:10px 12px}
.ais button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="apple-touch-icon.png" alt="Memo Terrain">

  <div id="go" hidden style="display:flex;flex-direction:column;gap:14px;width:100%">
    <p>Ouverture de Memo Terrain…</p>
    <a class="btn" id="goBtn" href="#">Ouvrir</a>
    <button class="link" type="button" id="change">Changer le lien</button>
  </div>

  <div id="setup" hidden style="display:flex;flex-direction:column;gap:12px;width:100%">
    <p><b>Première ouverture</b></p>
    <p class="muted">Quelle IA utilises-tu ?</p>
    <div class="ais" id="ais" role="group" aria-label="Choix de l'IA"></div>
    <p class="muted" id="hint"></p>
    <input type="url" id="url" placeholder="https://claude.ai/artifact/…" autocomplete="off" autocapitalize="off" spellcheck="false">
    <p class="err" id="err" hidden></p>
    <button type="button" id="save">Enregistrer et ouvrir</button>
    <a class="link" href="simple.html">Version sans IA</a>
  </div>
  <p class="credit">Application créée by <b>Cuicui</b></p>
</div>
<script>
const KEY="mt.claudeUrl",KEY_AI="mt.ai";
const AIS=[
  {id:"claude",name:"Claude",hosts:["claude.ai"],ex:"https://claude.ai/artifact/…"},
  {id:"chatgpt",name:"ChatGPT",hosts:["chatgpt.com","chat.openai.com"],ex:"https://chatgpt.com/…"},
  {id:"gemini",name:"Gemini",hosts:["gemini.google.com","g.co"],ex:"https://gemini.google.com/…"},
  {id:"mistral",name:"Le Chat",hosts:["chat.mistral.ai"],ex:"https://chat.mistral.ai/…"},
  {id:"copilot",name:"Copilot",hosts:["copilot.microsoft.com","copilot.cloud.microsoft","m365.cloud.microsoft"],ex:"https://copilot.microsoft.com/…"},
  {id:"autre",name:"Autre",hosts:null,ex:"https://…"}
];
const getK=k=>{try{return localStorage.getItem(k)||""}catch(e){return ""}};
const setK=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const get=()=>getK(KEY),set=v=>setK(KEY,v);
const $=id=>document.getElementById(id);
let ai=AIS.find(a=>a.id===getK(KEY_AI))||AIS[0];
function pick(a){ai=a;
  [...$("ais").children].forEach(b=>b.setAttribute("aria-pressed",b.dataset.id===a.id));
  $("url").placeholder=a.ex;$("err").hidden=true;
  $("hint").textContent=a.hosts?"Colle le lien de ton appli Memo Terrain sur "+a.name+" (celui qui commence par https://"+a.hosts[0]+"/…). Il reste enregistré uniquement sur ce téléphone.":"Colle le lien de ton appli Memo Terrain (il doit commencer par https://). Il reste enregistré uniquement sur ce téléphone.";}
AIS.forEach(a=>{const b=document.createElement("button");b.type="button";b.textContent=a.name;b.dataset.id=a.id;b.onclick=()=>pick(a);$("ais").appendChild(b);});
function ok(u,a){let h;try{const x=new URL(u);if(x.protocol!=="https:")return false;h=x.hostname}catch(e){return false}
  return !a.hosts||a.hosts.some(d=>h===d||h.endsWith("."+d));}
function showSetup(){$("go").hidden=true;$("setup").hidden=false;$("url").value=get();pick(ai);}
function launch(u){$("setup").hidden=true;$("go").hidden=false;$("goBtn").href=u;location.replace(u);}
$("change").onclick=showSetup;
$("save").onclick=()=>{
  const u=$("url").value.replace(/\s+/g,"");
  if(!ok(u,ai)){$("err").textContent=ai.hosts?"Ce lien ne commence pas par https://"+ai.hosts[0]+"/ . Vérifie l'IA choisie au-dessus.":"Ce lien doit commencer par https:// .";$("err").hidden=false;return;}
  $("err").hidden=true;set(u);setK(KEY_AI,ai.id);launch(u);
};
const saved=get();
if(saved&&!location.search.includes("reglage"))launch(saved);else showSetup();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
